name: Build TrivalRO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip TrivalRO-Android.zip

      - name: Add gradle.properties
        run: |
          echo "android.useAndroidX=true" >> TrivalRO-Android/gradle.properties
          echo "android.enableJetifier=true" >> TrivalRO-Android/gradle.properties

      - name: Fix CookieManager bug
        run: |
          sed -i 's/setAcceptThirdPartyCookies(this@apply, true)/setAcceptThirdPartyCookies(binding.webView, true)/' TrivalRO-Android/app/src/main/java/com/trivalro/client/MainActivity.kt
          sed -i 's|http://205.209.99.68:4000|https://valkynro.com|' TrivalRO-Android/app/src/main/java/com/trivalro/client/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.2 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: cd TrivalRO-Android && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrivalRO-debug
          path: TrivalRO-Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
